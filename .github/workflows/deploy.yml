name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Inject Pusher secret
        env:
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        run: |
          if [ -z "$PUSHER_SECRET" ]; then
            echo "::error::Secret PUSHER_SECRET non configurato: gli aggiornamenti realtime resterebbero disattivati."
            exit 1
          fi
          printf '<?php\nreturn %s;\n' "'$PUSHER_SECRET'" > assets/pusher-secret.php

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /sites/imposter.it/www/
